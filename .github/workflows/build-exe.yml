name: Build .exe portátil (Nuitka)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

# Precisa 'contents: write' pra o softprops/action-gh-release conseguir
# criar/atualizar a rolling release em push a main. Sem isso: HTTP 403
# 'Resource not accessible by integration'.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/.nuitka
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Compilar com Nuitka
        shell: pwsh
        run: |
          python build/build.py

      - name: Zipar pasta portátil
        shell: pwsh
        run: |
          # Nome FIXO pra rolling release em main — softprops sobrescreve,
          # não acumula. Assets com nome variável causavam múltiplos zips na
          # mesma tag 'latest' e o updater não sabia qual pegar.
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            $zipName = "LancamentoAutomatico-portatil.zip"
          } else {
            $version = "${{ github.ref_name }}".Replace("/", "-")
            $zipName = "LancamentoAutomatico-$version.zip"
          }
          Compress-Archive -Path "dist/LancamentoAutomatico.dist/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          Get-Item $zipName | Format-List Name, Length

      - name: Publicar como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: LancamentoAutomatico-portatil
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Calcular SHA256 do zip
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLower()
          echo "ZIP_SHA256=$hash" >> $env:GITHUB_ENV
          echo "SHA256: $hash"

      - name: Extrair BUILD_MARKER
        id: buildmark
        shell: pwsh
        run: |
          $bm = (Select-String -Path "src/main.py" -Pattern 'BUILD_MARKER = "(.+)"').Matches[0].Groups[1].Value
          echo "value=$bm" >> $env:GITHUB_OUTPUT
          echo "Detected: $bm"

      - name: Publicar rolling release (a cada push em main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.buildmark.outputs.value }}
          prerelease: true
          files: ${{ env.ZIP_NAME }}
          body: |
            Build automático da branch main.

            BUILD_MARKER=${{ steps.buildmark.outputs.value }}
            SHA256=${{ env.ZIP_SHA256 }}
            COMMIT=${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Limpar assets antigos da rolling release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Roda DEPOIS do upload — preserva o asset que acabou de ser
          # publicado ($env:ZIP_NAME). Antes deletávamos TUDO antes do upload,
          # o que abria uma janela de ~10s onde clientes que já tinham feito
          # check() (com URL do asset velho) recebiam HTTP 404 no download.
          $atual = $env:ZIP_NAME
          $existentes = gh release view latest --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existentes) {
            foreach ($nome in $existentes -split "`n") {
              $n = $nome.Trim()
              if ($n -and $n -ne $atual) {
                Write-Host "Deletando asset antigo: $n"
                gh release delete-asset latest "$n" --repo ${{ github.repository }} --yes 2>$null
              }
            }
          }

      - name: Publicar release oficial (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
